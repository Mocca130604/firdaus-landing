<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="50%" stop-color="#0b1320" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06090e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" />
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" />
  </g>

  <!-- Decorative Border -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" />

  <!-- Badge / Mission Tag -->
  <g transform="translate(80, 95)">
    <rect width="360" height="34" rx="17" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1" />
    <text x="180" y="22" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
      🚀 THE JOURNEY // JAPAN TO THE MOON
    </text>
  </g>

  <!-- Japanese Accents -->
  <text x="1120" y="118" font-family="'Noto Sans JP', sans-serif" font-size="20" fill="#94a3b8" opacity="0.5" text-anchor="end" letter-spacing="4">
    横浜から月へ • フィルダウス
  </text>

  <!-- Name & Title -->
  <text x="80" y="225" font-family="'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Firdaus Mochamad
  </text>

  <text x="80" y="285" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" fill="#38bdf8" letter-spacing="1">
    Frontend &amp; Full-Stack Developer
  </text>

  <!-- Subtitle -->
  <text x="80" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#94a3b8" letter-spacing="0.5">
    Enterprise Web Applications • Micro Frontends • 3D Interactive WebGL
  </text>

  <!-- Accent Divider Line -->
  <rect x="80" y="380" width="1040" height="3" fill="url(#accentLine)" rx="1.5" />

  <!-- Tech Stack Chips -->
  <g transform="translate(80, 420)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="140" height="42" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="70" y="26" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Vue.js / Nuxt</text>

    <!-- Chip 2 -->
    <rect x="155" y="0" width="125" height="42" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="217" y="26" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Three.js</text>

    <!-- Chip 3 -->
    <rect x="295" y="0" width="130" height="42" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="360" y="26" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">TypeScript</text>

    <!-- Chip 4 -->
    <rect x="440" y="0" width="120" height="42" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="500" y="26" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Laravel</text>

    <!-- Chip 5 -->
    <rect x="575" y="0" width="175" height="42" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="662" y="26" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Micro Frontends</text>

    <!-- Chip 6 -->
    <rect x="765" y="0" width="145" height="42" rx="8" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.3" />
    <text x="837" y="26" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">AI &amp; MCP</text>
  </g>

  <!-- Footer Telemetry -->
  <text x="80" y="540" font-family="'Courier New', monospace" font-size="14" fill="#64748b" letter-spacing="1">
    BASE: YOKOHAMA, KANAGAWA, JP • firdauscode.space
  </text>

  <text x="1120" y="540" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#4ade80" text-anchor="end" letter-spacing="1">
    ● TOUCHDOWN VERIFIED // 384,400 KM
  </text>
</svg>
